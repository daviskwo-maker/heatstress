<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Singapore Live WBGT</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:Arial;background:#071827;color:#fff}header{padding:10px 14px;background:#0b2538}#map{height:calc(100vh - 65px)}#box{position:fixed;z-index:1000;right:10px;bottom:10px;background:#082237ee;padding:10px;border-radius:8px;max-width:310px}.m{width:44px;height:44px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;color:#071827;font-weight:bold}.meta{font-size:12px;color:#b9d9eb}</style></head><body><header><b>Singapore Live WBGT Map</b><div id="status" class="meta">Loading NEA WBGT...</div></header><div id="map"></div><div id="box">Requesting current location...</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const API='https://api-open.data.gov.sg/v2/real-time/api/weather?api=wbgt',map=L.map('map').setView([1.3521,103.8198],11),layer=L.layerGroup().addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap'}).addTo(map);let data=[];
const color=(s)=>/high/i.test(s)?'#ff665e':/moderate/i.test(s)?'#ffd54f':'#45d275';function dist(a,b,c,d){const R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,q=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function estimate(lat,lon){let p=data.map(x=>({v:+x.wbgt,d:dist(lat,lon,+x.location.latitude,+x.location.longitude),n:x.station.townCenter||x.station.name})).filter(x=>isFinite(x.v)).sort((a,b)=>a.d-b.d).slice(0,4);if(!p.length)return null;if(p[0].d<.05)return {v:p[0].v,p};let sw=0,sv=0;p.forEach(x=>{let w=1/Math.max(x.d*x.d,.0001);sw+=w;sv+=w*x.v});return{v:sv/sw,p}}
function locate(){if(!navigator.geolocation)return document.getElementById('box').textContent='Geolocation unavailable';navigator.geolocation.getCurrentPosition(g=>{let lat=g.coords.latitude,lon=g.coords.longitude,e=estimate(lat,lon);L.circleMarker([lat,lon],{radius:10,color:'#fff',weight:3,fillColor:'#168cff',fillOpacity:1}).addTo(map).bindPopup(`<b>Your current location</b><br>${lat.toFixed(6)}, ${lon.toFixed(6)}<br><b>Interpolated WBGT: ${e?e.v.toFixed(1)+'°C':'N/A'}</b>`).openPopup();document.getElementById('box').innerHTML=`<b>Current coordinates</b><br>Lat: ${lat.toFixed(6)}<br>Lon: ${lon.toFixed(6)}<hr><b>Interpolated WBGT: ${e?e.v.toFixed(1)+'°C':'N/A'}</b><br><small>${e?'Inverse-distance weighted estimate from 4 nearest NEA WBGT stations. Nearest: '+e.p[0].n+' ('+e.p[0].d.toFixed(2)+' km)':'No station data'}</small>`},()=>document.getElementById('box').innerHTML='<b>Location permission required.</b><br><small>Browser geolocation normally requires HTTPS or localhost.</small>',{enableHighAccuracy:true,timeout:12000})}
async function load(){try{let j=await(await fetch(API,{cache:'no-store'})).json(),rec=j.data.records[0];data=rec.item.readings;layer.clearLayers();data.forEach(x=>{let v=+x.wbgt,ic=L.divIcon({className:'',html:`<div class="m" style="background:${color(x.heatStress)}">${v.toFixed(1)}°</div>`,iconSize:[44,44],iconAnchor:[22,22]});L.marker([+x.location.latitude,+x.location.longitude],{icon:ic}).bindPopup(`<b>${x.station.townCenter||x.station.name}</b><br>WBGT: <b>${v.toFixed(1)}°C</b><br>${x.heatStress}`).addTo(layer)});document.getElementById('status').textContent=`${data.length} stations • Updated ${new Date(rec.updatedTimestamp||rec.datetime).toLocaleString('en-SG',{timeZone:'Asia/Singapore'})}`;locate()}catch(e){document.getElementById('status').textContent='Unable to load API: '+e.message}}load();setInterval(load,900000);
</script></body></html>
