<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Singapore WBGT IDW Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0;font-family:Arial}.panel,.legend{position:fixed;z-index:1000;background:#09273bed;color:#fff;padding:11px;border-radius:9px;box-shadow:0 2px 12px #0007}.panel{top:10px;left:10px;max-width:350px}.legend{bottom:12px;right:10px;background:#fffffff2;color:#18242c;font-size:11px}.title{font-size:17px;font-weight:800}.small{font-size:12px;color:#cae4ef;margin-top:4px}.grad{width:190px;height:14px;background:linear-gradient(90deg,#2ca25f,#a1d76a,#ffe34d,#fd9a44,#d73027);border:1px solid #777;margin-top:5px}.station{width:42px;height:42px;border-radius:50%;border:3px solid white;display:flex;align-items:center;justify-content:center;font-weight:800;color:#10202b;box-shadow:0 2px 7px #0008}.leaflet-tooltip.label{background:transparent;border:0;box-shadow:none;font-weight:800;color:#101820;text-shadow:-1px -1px #fff,1px -1px #fff,-1px 1px #fff,1px 1px #fff}</style></head><body><div id="map"></div><div class="panel"><div class="title">Singapore WBGT — IDW Surface</div><div id="status" class="small">Loading live WBGT observations...</div><div id="loc" class="small" style="border-top:1px solid #ffffff44;margin-top:7px;padding-top:7px">Requesting GPS...</div></div><div class="legend"><b>IDW interpolated WBGT °C</b><div class="grad"></div><div>Contour interval: 0.5°C<br>Index contour: 1.0°C<br>IDW power p = 2 • 6 nearest stations</div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const API='https://api-open.data.gov.sg/v2/real-time/api/weather?api=wbgt';const map=L.map('map').setView([1.3521,103.8198],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{opacity:.68,attribution:'&copy; OpenStreetMap'}).addTo(map);const surf=L.layerGroup().addTo(map),st=L.layerGroup().addTo(map);let obs=[];
function dkm(a,b,c,d){const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,q=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(q))}
function idw(lat,lon){let a=obs.map(o=>({v:+o.wbgt,d:dkm(lat,lon,+o.location.latitude,+o.location.longitude)})).filter(x=>isFinite(x.v)).sort((x,y)=>x.d-y.d).slice(0,6);if(!a.length)return NaN;if(a[0].d<.03)return a[0].v;let sw=0,sv=0;a.forEach(x=>{let w=1/Math.pow(Math.max(x.d,.03),2);sw+=w;sv+=w*x.v});return sv/sw}
function col(v,mn,mx){let t=Math.max(0,Math.min(1,(v-mn)/(mx-mn||1)));return `hsl(${120*(1-t)},75%,52%)`}
function cross(a,b,l){let t=(l-a.v)/(b.v-a.v);return[a.lat+(b.lat-a.lat)*t,a.lon+(b.lon-a.lon)*t]}
function render(){surf.clearLayers();let mn=Math.min(...obs.map(x=>+x.wbgt)),mx=Math.max(...obs.map(x=>+x.wbgt)),minLat=1.20,maxLat=1.49,minLon=103.58,maxLon=104.08,nx=100,ny=60,g=[];for(let y=0;y<=ny;y++){g[y]=[];for(let x=0;x<=nx;x++){let lat=minLat+(maxLat-minLat)*y/ny,lon=minLon+(maxLon-minLon)*x/nx;g[y][x]={lat,lon,v:idw(lat,lon)}}}
// IDW colour surface
for(let y=0;y<ny;y+=2)for(let x=0;x<nx;x+=2){let v=g[y][x].v;L.rectangle([[g[y][x].lat,g[y][x].lon],[g[Math.min(y+2,ny)][Math.min(x+2,nx)].lat,g[Math.min(y+2,ny)][Math.min(x+2,nx)].lon]],{stroke:false,fillColor:col(v,mn,mx),fillOpacity:.22,interactive:false}).addTo(surf)}
// 0.5 C contour extraction
let lo=Math.floor(mn*2)/2,hi=Math.ceil(mx*2)/2;for(let l=lo;l<=hi+.01;l+=.5){let seg=[];for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){let q=[g[y][x],g[y][x+1],g[y+1][x+1],g[y+1][x]],e=[];for(let k=0;k<4;k++){let a=q[k],b=q[(k+1)%4];if((a.v<l&&b.v>=l)||(b.v<l&&a.v>=l))e.push(cross(a,b,l))}if(e.length===2)seg.push(e);if(e.length===4)seg.push([e[0],e[1]],[e[2],e[3]])}let major=Math.abs(l-Math.round(l))<.01;seg.forEach((s,i)=>{let ln=L.polyline(s,{color:col(l,mn,mx),weight:major?3.2:1.5,opacity:1}).addTo(surf);if(i%Math.max(1,Math.floor(seg.length/8))===0)ln.bindTooltip(l.toFixed(1)+'°C',{permanent:true,direction:'center',className:'label'})})}}
function gps(){navigator.geolocation?.getCurrentPosition(p=>{let lat=p.coords.latitude,lon=p.coords.longitude,v=idw(lat,lon);L.circleMarker([lat,lon],{radius:9,color:'#fff',weight:3,fillColor:'#0677f9',fillOpacity:1}).addTo(map).bindPopup(`<b>Current location</b><br>${lat.toFixed(6)}, ${lon.toFixed(6)}<br>IDW WBGT: <b>${v.toFixed(1)}°C</b>`).openPopup();document.getElementById('loc').innerHTML=`<b>Current coordinate</b><br>${lat.toFixed(6)}, ${lon.toFixed(6)}<br><b>IDW estimate: ${v.toFixed(1)}°C</b>`},()=>document.getElementById('loc').textContent='Allow location permission to calculate local IDW WBGT.',{enableHighAccuracy:true,timeout:12000})}
async function load(){try{let j=await(await fetch(API,{cache:'no-store'})).json(),r=j.data.records[0];obs=r.item.readings;st.clearLayers();let mn=Math.min(...obs.map(x=>+x.wbgt)),mx=Math.max(...obs.map(x=>+x.wbgt));obs.forEach(o=>{let v=+o.wbgt,ic=L.divIcon({className:'',html:`<div class="station" style="background:${col(v,mn,mx)}">${v.toFixed(1)}°</div>`,iconSize:[42,42],iconAnchor:[21,21]});L.marker([+o.location.latitude,+o.location.longitude],{icon:ic}).bindPopup(`<b>${o.station.townCenter||o.station.name}</b><br>Measured WBGT: <b>${v.toFixed(1)}°C</b><br>${o.heatStress}`).addTo(st)});render();gps();document.getElementById('status').textContent=`${obs.length} stations • IDW p=2 • 6 nearest • Updated ${new Date(r.updatedTimestamp||r.datetime).toLocaleString('en-SG',{timeZone:'Asia/Singapore'})}`}catch(e){document.getElementById('status').textContent='API error: '+e.message}}load();setInterval(load,900000);
</script></body></html>
