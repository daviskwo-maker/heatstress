<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Singapore WBGT IDW Advisory</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0;font-family:Arial}.p{position:fixed;z-index:1000;top:8px;left:8px;background:#09273bef;color:#fff;padding:10px;border-radius:9px;max-width:390px;max-height:94vh;overflow:auto}.s{font-size:12px;margin-top:6px}.box{padding:8px;border-radius:7px;margin-top:7px}.dot{width:40px;height:40px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;color:#111;font-weight:bold}</style></head><body><div id="map"></div><div class="p"><b>Singapore WBGT — IDW</b><div id="status" class="s">Loading...</div><div id="loc" class="s">Requesting GPS...</div><div id="adv" class="s box">Advisory pending...</div><div class="s"><b>Last 5 readings at current location</b><div id="hist">Collecting...</div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const API='https://api-open.data.gov.sg/v2/real-time/api/weather?api=wbgt',map=L.map('map').setView([1.3521,103.8198],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{opacity:.7}).addTo(map);let obs=[];const layer=L.layerGroup().addTo(map);function dk(a,b,c,d){let r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,q=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(q))}function idw(lat,lon){let p=obs.map(o=>({v:+o.wbgt,d:dk(lat,lon,+o.location.latitude,+o.location.longitude)})).filter(x=>isFinite(x.v)).sort((a,b)=>a.d-b.d).slice(0,6),sw=0,sv=0;if(!p.length)return NaN;if(p[0].d<.03)return p[0].v;p.forEach(x=>{let w=1/Math.max(x.d*x.d,.001);sw+=w;sv+=w*x.v});return sv/sw}function col(v){return v>=33?'#ff3434':v>=31?'#ffdc58':'#00c56a'}
function advice(v){let common='<b>Acclimatise:</b> New workers to Singapore, or workers returning from leave of more than a week, should gradually increase daily heat exposure over at least 7 days.<br>';if(v<31)return[common+'<b>Drink:</b> Cool/cold drinking water near work areas; rehydrate regularly.<br><b>Rest & Shade:</b> Adequate rest under shade; locate rest areas near work areas where feasible.','#00c56a','WBGT <31°C'];if(v<32)return[common+'<b>Drink:</b> Cool/cold water near work areas; rehydrate at least hourly (recommended 300 ml/hour or more depending on work intensity).<br><b>Rest & Shade:</b> Adequate rest under shade; rest areas near work areas where feasible.','#ffdc58','WBGT 31 to <32°C'];if(v<33)return[common+'<b>Drink:</b> Rehydrate at least hourly (recommended 300 ml/hour or more depending on work intensity).<br><b>Rest & Shade:</b> For heavy physical work, hourly rest breaks of at least 10 minutes when WBGT reaches 32°C and above.','#ffbf3e','WBGT 32 to <33°C'];return[common+'<b>Drink:</b> Cool/cold water near work areas; rehydrate at least hourly.<br><b>Rest & Shade:</b> For heavy physical work, hourly rest breaks of at least 15 minutes; longer rest periods recommended as WBGT increases.','#ff3434','WBGT ≥33°C']}
function history(lat,lon,v){let h=[];try{h=JSON.parse(localStorage.getItem('wbgt5')||'[]')}catch(e){};h.unshift({t:new Date().toISOString(),lat,lon,v});h=h.slice(0,5);try{localStorage.setItem('wbgt5',JSON.stringify(h))}catch(e){};document.getElementById('hist').innerHTML=h.map((x,i)=>`<div style="padding:4px 0;border-bottom:1px solid #ffffff2c">${i+1}. ${new Date(x.t).toLocaleString('en-SG',{timeZone:'Asia/Singapore'})} — <b>${(+x.v).toFixed(1)}°C</b></div>`).join('')}
function gps(){navigator.geolocation?.getCurrentPosition(g=>{let lat=g.coords.latitude,lon=g.coords.longitude,v=idw(lat,lon),a=advice(v);document.getElementById('loc').innerHTML=`<b>Current location</b><br>${lat.toFixed(6)}, ${lon.toFixed(6)}<br>IDW WBGT: <b>${v.toFixed(1)}°C</b>`;let e=document.getElementById('adv');e.style.background=a[1];e.style.color='#111';e.innerHTML=`<b>${a[2]} — Current-location advisory</b><br>${a[0]}<br><small>Advisory transcribed from supplied WBGT bands. IDW value is an estimate, not a direct measurement.</small>`;L.circleMarker([lat,lon],{radius:9,color:'#fff',weight:3,fillColor:'#147df5',fillOpacity:1}).addTo(map).bindPopup(`Current location<br>IDW WBGT: <b>${v.toFixed(1)}°C</b>`).openPopup();history(lat,lon,v)},()=>document.getElementById('loc').textContent='Allow location access to calculate local WBGT.',{enableHighAccuracy:true,timeout:12000})}
async function load(){try{let j=await(await fetch(API,{cache:'no-store'})).json(),r=j.data.records[0];obs=r.item.readings;layer.clearLayers();obs.forEach(o=>{let v=+o.wbgt,ic=L.divIcon({className:'',html:`<div class="dot" style="background:${col(v)}">${v.toFixed(1)}°</div>`,iconSize:[40,40],iconAnchor:[20,20]});L.marker([+o.location.latitude,+o.location.longitude],{icon:ic}).bindPopup(`<b>${o.station.townCenter||o.station.name}</b><br>Measured WBGT ${v.toFixed(1)}°C`).addTo(layer)});document.getElementById('status').textContent=`${obs.length} stations • IDW p=2, 6 nearest • ${new Date(r.updatedTimestamp||r.datetime).toLocaleString('en-SG',{timeZone:'Asia/Singapore'})}`;gps()}catch(e){document.getElementById('status').textContent='API error: '+e.message}}load();setInterval(load,900000);
</script></body></html>
