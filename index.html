<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Singapore WBGT Topographic Contours</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}body{font-family:Arial}.panel{position:fixed;z-index:1000;left:10px;top:10px;background:#09273bea;color:white;padding:11px 13px;border-radius:9px;box-shadow:0 2px 12px #0008;max-width:330px}.title{font-size:17px;font-weight:800}.meta{font-size:12px;color:#c9e2ef;margin-top:3px}.loc{margin-top:7px;padding-top:7px;border-top:1px solid #ffffff35;font-size:12px}.legend{position:fixed;z-index:1000;right:10px;bottom:15px;background:#fffefa;padding:10px;border-radius:8px;box-shadow:0 2px 12px #0005;font-size:11px}.grad{height:14px;width:180px;background:linear-gradient(90deg,#159447,#8dd35f,#ffe45b,#ff9e42,#e53935);border:1px solid #777}.station{width:42px;height:42px;border-radius:50%;border:3px solid white;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#10202b;box-shadow:0 2px 7px #0009}.leaflet-tooltip.contour-label{background:transparent;border:0;box-shadow:none;color:#101820;font-weight:800;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff}</style></head><body><div id="map"></div><div class="panel"><div class="title">Singapore WBGT Topographic Map</div><div id="status" class="meta">Loading live NEA readings...</div><div id="loc" class="loc">Requesting current location...</div></div><div class="legend"><b>Interpolated WBGT (°C)</b><div class="grad"></div><div style="display:flex;justify-content:space-between"><span>Lower</span><span>0.5°C contour interval</span><span>Higher</span></div><div style="margin-top:5px">Thin line: 0.5°C &nbsp;|&nbsp; Thick line: 1.0°C</div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const API='https://api-open.data.gov.sg/v2/real-time/api/weather?api=wbgt';const map=L.map('map').setView([1.3521,103.8198],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{opacity:.68,attribution:'&copy; OpenStreetMap'}).addTo(map);const contours=L.layerGroup().addTo(map),stations=L.layerGroup().addTo(map);let data=[];
function km(a,b,c,d){let r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,q=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(q))}function idw(lat,lon){let p=data.map(x=>({v:+x.wbgt,d:km(lat,lon,+x.location.latitude,+x.location.longitude)})).filter(x=>isFinite(x.v)).sort((a,b)=>a.d-b.d).slice(0,6);if(!p.length)return NaN;if(p[0].d<.03)return p[0].v;let s=0,w=0;p.forEach(x=>{let z=1/Math.pow(Math.max(x.d,.05),2);s+=z*x.v;w+=z});return s/w}function c(v){let t=Math.max(0,Math.min(1,(v-27)/8)),h=(120*(1-t));return `hsl(${h},75%,52%)`}
function pt(a,b,v){let t=(v-a.v)/(b.v-a.v||1);return[a.lat+(b.lat-a.lat)*t,a.lon+(b.lon-a.lon)*t]}
function render(){contours.clearLayers();const minLat=1.20,maxLat=1.49,minLon=103.58,maxLon=104.08,nx=90,ny=58,grid=[];for(let y=0;y<=ny;y++){let row=[];for(let x=0;x<=nx;x++){let lat=minLat+(maxLat-minLat)*y/ny,lon=minLon+(maxLon-minLon)*x/nx;row.push({lat,lon,v:idw(lat,lon)})}grid.push(row)}let mn=Math.min(...data.map(x=>+x.wbgt)),mx=Math.max(...data.map(x=>+x.wbgt)),lo=Math.floor(mn*2)/2,hi=Math.ceil(mx*2)/2;
// translucent topographic colour cells
for(let y=0;y<ny;y+=2)for(let x=0;x<nx;x+=2){let v=grid[y][x].v;L.rectangle([[grid[y][x].lat,grid[y][x].lon],[grid[Math.min(y+2,ny)][Math.min(x+2,nx)].lat,grid[Math.min(y+2,ny)][Math.min(x+2,nx)].lon]],{stroke:false,fillColor:c(v),fillOpacity:.16,interactive:false}).addTo(contours)}
// marching-squares-like contour segments at every 0.5 C
for(let level=lo;level<=hi+.001;level+=.5){let segs=[];for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){let q=[grid[y][x],grid[y][x+1],grid[y+1][x+1],grid[y+1][x]],e=[];for(let k=0;k<4;k++){let a=q[k],b=q[(k+1)%4];if((a.v<level&&b.v>=level)||(b.v<level&&a.v>=level))e.push(pt(a,b,level))}if(e.length===2)segs.push(e);else if(e.length===4){segs.push([e[0],e[1]],[e[2],e[3]])}}let major=Math.abs(level-Math.round(level))<.01;segs.forEach((s,i)=>{let line=L.polyline(s,{color:c(level),weight:major?3:1.5,opacity:.95,interactive:true}).addTo(contours);if(i%Math.max(1,Math.floor(segs.length/7))===0)line.bindTooltip(level.toFixed(1)+'°C',{permanent:true,direction:'center',className:'contour-label'})})}}
function locate(){navigator.geolocation?.getCurrentPosition(g=>{let la=g.coords.latitude,lo=g.coords.longitude,v=idw(la,lo);L.circleMarker([la,lo],{radius:9,color:'#fff',weight:3,fillColor:'#147df5',fillOpacity:1}).addTo(map).bindPopup(`<b>Current location</b><br>${la.toFixed(6)}, ${lo.toFixed(6)}<br>Interpolated WBGT: <b>${v.toFixed(1)}°C</b>`).openPopup();document.getElementById('loc').innerHTML=`<b>Current coordinates</b><br>${la.toFixed(6)}, ${lo.toFixed(6)}<br><b>Estimated WBGT: ${v.toFixed(1)}°C</b>`},()=>document.getElementById('loc').textContent='Allow location permission to show current coordinates.',{enableHighAccuracy:true,timeout:12000})}
async function load(){try{let j=await(await fetch(API,{cache:'no-store'})).json(),r=j.data.records[0];data=r.item.readings;stations.clearLayers();data.forEach(x=>{let v=+x.wbgt,ic=L.divIcon({className:'',html:`<div class="station" style="background:${c(v)}">${v.toFixed(1)}°</div>`,iconSize:[42,42],iconAnchor:[21,21]});L.marker([+x.location.latitude,+x.location.longitude],{icon:ic}).bindPopup(`<b>${x.station.townCenter||x.station.name}</b><br>Measured WBGT: <b>${v.toFixed(1)}°C</b><br>${x.heatStress}`).addTo(stations)});render();locate();document.getElementById('status').textContent=`${data.length} NEA stations • Updated ${new Date(r.updatedTimestamp||r.datetime).toLocaleString('en-SG',{timeZone:'Asia/Singapore'})}` }catch(e){document.getElementById('status').textContent='Unable to load live WBGT: '+e.message}}load();setInterval(load,900000);
</script></body></html>
