<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Singapore WBGT IDW</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0;font-family:Arial}.p{position:fixed;z-index:1000;top:8px;left:8px;background:#09273bef;color:#fff;padding:10px;border-radius:9px;max-width:390px;max-height:58vh;overflow:auto}.s{font-size:12px;margin-top:6px}.box{padding:8px;border-radius:7px}.h{position:fixed;z-index:1000;left:8px;right:8px;bottom:8px;background:#fffffff2;color:#17232c;border-radius:9px;padding:9px;max-width:560px;margin:auto;box-shadow:0 2px 12px #0006}.h h3{font-size:13px;margin:0 0 6px}.h table{width:100%;border-collapse:collapse;font-size:11px}.h th,.h td{padding:6px;border:1px solid #ccd5da;text-align:left}.h th{background:#eaf0f3}.dot{width:40px;height:40px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;color:#111;font-weight:bold}@media(max-width:600px){.p{max-width:calc(100vw - 36px);max-height:52vh}.h{left:5px;right:5px;overflow-x:auto}.h table{min-width:380px}}</style></head><body><div id="map"></div><div class="p"><b>Singapore WBGT — IDW</b><div id="status" class="s">Loading...</div><div id="loc" class="s">Requesting current position...</div><div id="adv" class="s box">Advisory pending...</div></div><div class="h"><h3>Latest 5 Readings</h3><table><thead><tr><th>Timestamp (SGT)</th><th>IDW WBGT</th><th>Band</th></tr></thead><tbody id="hist"><tr><td colspan="3">Collecting readings...</td></tr></tbody></table></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const API='https://api-open.data.gov.sg/v2/real-time/api/weather?api=wbgt',map=L.map('map').setView([1.3521,103.8198],11),ly=L.layerGroup().addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{opacity:.7}).addTo(map);let obs=[];function d(a,b,c,e){let r=Math.PI/180,x=(c-a)*r,y=(e-b)*r,q=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(q))}function idw(a,b){let p=obs.map(o=>({v:+o.wbgt,d:d(a,b,+o.location.latitude,+o.location.longitude)})).sort((x,y)=>x.d-y.d).slice(0,6),sw=0,sv=0;if(p[0].d<.03)return p[0].v;p.forEach(x=>{let w=1/Math.max(x.d*x.d,.001);sw+=w;sv+=w*x.v});return sv/sw}const color=v=>v>=33?'#ff3434':v>=31?'#ffdc58':'#00c56a',band=v=>v>=33?'≥33°C':v>=31?'31–<33°C':'<31°C';function adv(v){let a=v<31?['#00c56a','Rehydrate regularly. Ensure adequate rest under shade.']:v<32?['#ffdc58','Rehydrate at least hourly. Ensure adequate rest under shade.']:v<33?['#ffbf3e','Rehydrate at least hourly. For heavy physical work, provide at least 10 minutes rest each hour.']:['#ff3434','Rehydrate at least hourly. For heavy physical work, provide at least 15 minutes rest each hour; increase rest as WBGT rises.'];let e=document.getElementById('adv');e.style.background=a[0];e.style.color='#111';e.innerHTML='<b>Current-location advisory — '+band(v)+'</b><br>Acclimatise new/returning workers progressively over at least 7 days. '+a[1]+'<br><small>IDW WBGT is an interpolated estimate.</small>'}function hist(v,stamp){let h=[];try{h=JSON.parse(localStorage.getItem('wbgt5')||'[]')}catch(e){};let key=stamp||new Date().toISOString();if(!h.length||h[0].t!==key)h.unshift({t:key,v});h=h.slice(0,5);localStorage.setItem('wbgt5',JSON.stringify(h));document.getElementById('hist').innerHTML=h.map(x=>`<tr><td>${new Date(x.t).toLocaleString('en-SG',{timeZone:'Asia/Singapore'})}</td><td style="background:${color(+x.v)}"><b>${(+x.v).toFixed(1)}°C</b></td><td>${band(+x.v)}</td></tr>`).join('')}function gps(stamp){navigator.geolocation.getCurrentPosition(g=>{let a=g.coords.latitude,b=g.coords.longitude,v=idw(a,b);document.getElementById('loc').innerHTML='<b>Current position</b><br>IDW WBGT: <b>'+v.toFixed(1)+'°C</b>';L.circleMarker([a,b],{radius:9,color:'#fff',weight:3,fillColor:'#147df5',fillOpacity:1}).addTo(map).bindPopup('<b>Current position</b><br>IDW WBGT: '+v.toFixed(1)+'°C').openPopup();adv(v);hist(v,stamp)},()=>document.getElementById('loc').textContent='Allow location access to calculate local WBGT.',{enableHighAccuracy:true,timeout:12000})}async function load(){try{let j=await(await fetch(API,{cache:'no-store'})).json(),r=j.data.records[0];obs=r.item.readings;ly.clearLayers();obs.forEach(o=>{let v=+o.wbgt,ic=L.divIcon({className:'',html:`<div class="dot" style="background:${color(v)}">${v.toFixed(1)}°</div>`,iconSize:[40,40],iconAnchor:[20,20]});L.marker([+o.location.latitude,+o.location.longitude],{icon:ic}).bindPopup(`<b>${o.station.townCenter||o.station.name}</b><br>Measured WBGT ${v.toFixed(1)}°C`).addTo(ly)});let stamp=r.updatedTimestamp||r.datetime||new Date().toISOString();document.getElementById('status').textContent=obs.length+' stations • IDW p=2, 6 nearest • '+new Date(stamp).toLocaleString('en-SG',{timeZone:'Asia/Singapore'});gps(stamp)}catch(e){document.getElementById('status').textContent='API error: '+e.message}}load();setInterval(load,900000);
</script></body></html>
