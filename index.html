<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Singapore WBGT IDW Topographic Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0;font-family:Arial}.panel{position:fixed;z-index:1000;top:8px;left:8px;background:#09273bef;color:#fff;padding:10px;border-radius:9px;max-width:390px;max-height:57vh;overflow:auto}.small{font-size:12px;margin-top:5px}.adv{padding:8px;border-radius:7px;color:#111;margin-top:7px}.history{position:fixed;z-index:1000;left:8px;right:8px;bottom:8px;background:#fffffff2;color:#17232c;border-radius:9px;padding:9px;max-width:570px;margin:auto;box-shadow:0 2px 12px #0006}.history h3{font-size:13px;margin:0 0 6px}.history table{width:100%;border-collapse:collapse;font-size:11px}.history th,.history td{padding:6px;border:1px solid #ccd5da;text-align:left}.history th{background:#eaf0f3}.station{width:40px;height:40px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;color:#111;font-weight:bold;box-shadow:0 2px 7px #0008}.leaflet-tooltip.cl{background:transparent;border:0;box-shadow:none;font-weight:800;color:#111;text-shadow:-1px -1px #fff,1px -1px #fff,-1px 1px #fff,1px 1px #fff}@media(max-width:600px){.panel{max-width:calc(100vw - 36px);max-height:48vh}.history{left:5px;right:5px;overflow-x:auto}.history table{min-width:400px}}</style></head><body><div id="map"></div><div class="panel"><b>Singapore WBGT — IDW Topographic Map</b><div id="status" class="small">Loading live observations...</div><div id="loc" class="small">Requesting current position...</div><div id="adv" class="adv">Advisory pending...</div><div class="small">Contour interval: <b>0.5°C</b> • IDW power: <b>2</b> • 6 nearest stations</div></div><div class="history"><h3>Last 5 Hourly Readings at Current Location</h3><table><thead><tr><th>Timestamp (SGT)</th><th>IDW WBGT</th><th>Band</th></tr></thead><tbody id="hist"><tr><td colspan="3">Loading hourly history...</td></tr></tbody></table></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const BASE='https://api-open.data.gov.sg/v2/real-time/api/weather?api=wbgt',map=L.map('map').setView([1.3521,103.8198],11),surface=L.layerGroup().addTo(map),markers=L.layerGroup().addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{opacity:.68,attribution:'&copy; OpenStreetMap'}).addTo(map);let current=[],gpsPos=null;
function dist(a,b,c,d){let r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,q=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(q))}function idw(obs,lat,lon){let p=obs.map(o=>({v:+o.wbgt,d:dist(lat,lon,+o.location.latitude,+o.location.longitude)})).filter(x=>isFinite(x.v)).sort((a,b)=>a.d-b.d).slice(0,6);if(!p.length)return NaN;if(p[0].d<.03)return p[0].v;let sw=0,sv=0;p.forEach(x=>{let w=1/Math.max(x.d*x.d,.001);sw+=w;sv+=w*x.v});return sv/sw}const band=v=>v>=33?'≥33°C':v>=31?'31–<33°C':'<31°C',color=v=>v>=33?'#ff3434':v>=31?'#ffdc58':'#00c56a';function scale(v,mn,mx){let t=Math.max(0,Math.min(1,(v-mn)/(mx-mn||1)));return `hsl(${120*(1-t)},75%,50%)`}function cross(a,b,l){let t=(l-a.v)/(b.v-a.v);return[a.lat+(b.lat-a.lat)*t,a.lon+(b.lon-a.lon)*t]}
function contours(){surface.clearLayers();let mn=Math.min(...current.map(x=>+x.wbgt)),mx=Math.max(...current.map(x=>+x.wbgt)),a=1.20,b=1.49,c=103.58,d=104.08,nx=90,ny=56,g=[];for(let y=0;y<=ny;y++){g[y]=[];for(let x=0;x<=nx;x++){let lat=a+(b-a)*y/ny,lon=c+(d-c)*x/nx;g[y][x]={lat,lon,v:idw(current,lat,lon)}}}for(let y=0;y<ny;y+=2)for(let x=0;x<nx;x+=2)L.rectangle([[g[y][x].lat,g[y][x].lon],[g[Math.min(y+2,ny)][Math.min(x+2,nx)].lat,g[Math.min(y+2,ny)][Math.min(x+2,nx)].lon]],{stroke:false,fillColor:scale(g[y][x].v,mn,mx),fillOpacity:.20,interactive:false}).addTo(surface);let lo=Math.floor(mn*2)/2,hi=Math.ceil(mx*2)/2;for(let l=lo;l<=hi+.01;l+=.5){let seg=[];for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){let q=[g[y][x],g[y][x+1],g[y+1][x+1],g[y+1][x]],e=[];for(let k=0;k<4;k++){let u=q[k],v=q[(k+1)%4];if((u.v<l&&v.v>=l)||(v.v<l&&u.v>=l))e.push(cross(u,v,l))}if(e.length===2)seg.push(e);else if(e.length===4)seg.push([e[0],e[1]],[e[2],e[3]])}let major=Math.abs(l-Math.round(l))<.01;seg.forEach((s,i)=>{let z=L.polyline(s,{color:scale(l,mn,mx),weight:major?3.2:1.5,opacity:.95}).addTo(surface);if(i%Math.max(1,Math.floor(seg.length/7))===0)z.bindTooltip(l.toFixed(1)+'°C',{permanent:true,direction:'center',className:'cl'})})}}
function extractRecords(j){let r=j?.data?.records||j?.data?.items||[];return r.map(x=>({stamp:x.updatedTimestamp||x.datetime||x.timestamp||x.date,obs:x.item?.readings||x.readings||[]})).filter(x=>x.obs.length&&x.stamp).sort((a,b)=>new Date(b.stamp)-new Date(a.stamp))}function hourlyFive(records){let out=[],seen=new Set();for(let r of records){let dt=new Date(r.stamp),key=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Singapore',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false}).format(dt);if(!seen.has(key)){seen.add(key);out.push(r)}if(out.length===5)break}return out}
function renderHistory(records){let h=hourlyFive(records),rows=h.map(r=>{let v=idw(r.obs,gpsPos.lat,gpsPos.lon);return `<tr><td>${new Date(r.stamp).toLocaleString('en-SG',{timeZone:'Asia/Singapore'})}</td><td style="background:${color(v)}"><b>${v.toFixed(1)}°C</b></td><td>${band(v)}</td></tr>`}).join('');document.getElementById('hist').innerHTML=rows||'<tr><td colspan="3">Five hourly records are not available from the API response.</td></tr>'}
function advisory(v){let msg=v<31?'Rehydrate regularly and provide adequate shaded rest.':v<32?'Rehydrate at least hourly and provide adequate shaded rest.':v<33?'Rehydrate at least hourly. For heavy physical work, provide at least 10 minutes rest each hour.':'Rehydrate at least hourly. For heavy physical work, provide at least 15 minutes rest each hour and increase rest as WBGT rises.';let e=document.getElementById('adv');e.style.background=color(v);e.innerHTML='<b>Current-location advisory — '+band(v)+'</b><br>Acclimatise new or returning workers progressively over at least 7 days. '+msg+'<br><small>IDW value is interpolated, not directly measured.</small>'}
async function history(){let now=new Date(),sg=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Singapore'})),date=sg.getFullYear()+'-'+String(sg.getMonth()+1).padStart(2,'0')+'-'+String(sg.getDate()).padStart(2,'0');try{let j=await(await fetch(BASE+'&date='+date,{cache:'no-store'})).json(),r=extractRecords(j);if(r.length<5){let saved=[];try{saved=JSON.parse(localStorage.getItem('wbgtHourly')||'[]')}catch(e){};r=r.concat(saved)}renderHistory(r)}catch(e){document.getElementById('hist').innerHTML='<tr><td colspan="3">Hourly history unavailable: '+e.message+'</td></tr>'}}
function locate(stamp){navigator.geolocation.getCurrentPosition(g=>{gpsPos={lat:g.coords.latitude,lon:g.coords.longitude};let v=idw(current,gpsPos.lat,gpsPos.lon);document.getElementById('loc').innerHTML='<b>Current position</b><br>IDW WBGT: <b>'+v.toFixed(1)+'°C</b>';L.circleMarker([gpsPos.lat,gpsPos.lon],{radius:9,color:'#fff',weight:3,fillColor:'#147df5',fillOpacity:1}).addTo(map).bindPopup('<b>Current position</b><br>IDW WBGT: '+v.toFixed(1)+'°C').openPopup();advisory(v);history()},()=>document.getElementById('loc').textContent='Allow browser location access to calculate local IDW WBGT.',{enableHighAccuracy:true,timeout:12000})}
async function load(){try{let j=await(await fetch(BASE,{cache:'no-store'})).json(),r=extractRecords(j)[0];current=r.obs;markers.clearLayers();current.forEach(o=>{let v=+o.wbgt,ic=L.divIcon({className:'',html:`<div class="station" style="background:${color(v)}">${v.toFixed(1)}°</div>`,iconSize:[40,40],iconAnchor:[20,20]});L.marker([+o.location.latitude,+o.location.longitude],{icon:ic}).bindPopup(`<b>${o.station?.townCenter||o.station?.name||'WBGT station'}</b><br>Measured WBGT: <b>${v.toFixed(1)}°C</b>`).addTo(markers)});contours();document.getElementById('status').textContent=current.length+' stations • Updated '+new Date(r.stamp).toLocaleString('en-SG',{timeZone:'Asia/Singapore'});locate(r.stamp)}catch(e){document.getElementById('status').textContent='Unable to load WBGT API: '+e.message}}load();setInterval(load,900000);
</script></body></html>
